<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan CP·MKT</title>
<style>
:root{
  --bg:#F4F5F7;--card:#FFFFFF;--ink:#1B1F27;--mute:#6B7280;--line:#E3E6EB;--soft:#EEF1F5;
  --brand:#1F3864;--brand2:#2F5596;
  --chua:#94A3B8;--dang:#D97706;--xong:#16A34A;--quagio:#DC2626;--tre:#7C3AED;--chuyen:#9CA3AF;--bo:#9CA3AF;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;padding:10px 18px 0}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px}
.mode{font-size:12px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.15)}
.mode.demo{background:#F59E0B;color:#1B1F27}
.ctrl{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}
.pill button{background:none;border:0;color:#fff;padding:5px 11px;border-radius:8px;cursor:pointer;font-weight:600}
.pill button:hover{background:rgba(255,255,255,.14)}
.pill button.on{background:#fff;color:var(--brand)}
.pill.lt{background:#E5E9F0}.pill.lt button{color:#334155}.pill.lt button:hover{background:#D6DCE6}.pill.lt button.pri{background:var(--brand);color:#fff}
.pill input{background:transparent;border:0;color:#fff;font-weight:600;width:130px;text-align:center;color-scheme:dark}
nav{display:flex;gap:2px;margin-top:10px}
nav button{background:none;border:0;color:rgba(255,255,255,.75);padding:9px 16px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:600}
nav button.on{background:var(--bg);color:var(--brand)}
main{padding:16px 18px 60px;max-width:1500px;margin:0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#C3C9D2}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn.gap{background:#FEF3C7;border-color:#F59E0B;color:#92400E}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.btn.ghost{background:transparent;border-style:dashed;color:var(--mute)}
.btn.danger{color:var(--quagio)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.muted{color:var(--mute)} .hint{font-size:12px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:20px;font-size:12px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);white-space:nowrap}
.chip.ok{background:#DCFCE7;color:#166534;border-color:#BBF7D0} .chip.miss{background:#FEE2E2;color:#991B1B;border-color:#FECACA} .chip.warn{background:#FEF3C7;color:#92400E;border-color:#FDE68A} .chip.tre{background:#EDE9FE;color:#5B21B6;border-color:#DDD6FE}
.chip.dg{background:#fff;border-color:#CBD5E1;color:#334155}
.pc{display:inline-flex;align-items:center;padding:0 8px;border-radius:20px;border:2px solid var(--pc);color:var(--pc);background:#fff;font-size:12px;font-weight:700;white-space:nowrap;line-height:18px}
.pc.none{--pc:#DC2626;border-style:dashed}
.summary{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:-2px 0 12px}
.summary b{color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-left:auto;color:#374151}
h3{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px;line-height:1.2}
.kpi span{font-size:12px;color:var(--mute)}
.sec{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* ===== Cây tổng thể ===== */
.mmwrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 22px}
.mm{position:relative;display:inline-block;min-width:100%}
.mm svg.lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column;justify-content:center;gap:10px}
.col.c-mang{gap:26px;margin-left:44px}
.col.c-nhom{gap:18px;margin-left:40px}
.col.c-cd{gap:14px;margin-left:42px}
.col.c-task{gap:6px;margin-left:38px}
.nd{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:7px 11px;font-size:13px;background:#fff}
.nd.root{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700;font-size:14px;padding:10px 14px;text-align:center;min-width:130px}
.nd.root small{display:block;font-weight:500;opacity:.8;font-size:12px}
.nd.mang{min-width:170px;background:var(--mc);color:var(--mink);border-color:var(--mc);font-weight:800;font-size:15px;padding:9px 30px 9px 12px}
.nd.mang .sub{display:block;font-weight:600;font-size:12px;opacity:.92}
.nd.mang .ppl{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.nd.nhom{min-width:150px;background:var(--mg);border-color:color-mix(in srgb,var(--mc) 55%,#fff);font-weight:700;padding:7px 30px 7px 11px}
.nd.nhom .sub{display:block;font-weight:500;font-size:12px;color:#374151}
.fold{cursor:pointer;margin-right:4px;font-size:11px;opacity:.85}
.nd.cd{width:300px;background:var(--mcd);border-color:color-mix(in srgb,var(--mc) 40%,#fff);cursor:grab}
.nd.cd .ttl{font-weight:700;line-height:1.3;padding-right:22px}
.nd.cd .who{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.nd.cd .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.nd.task{width:380px;cursor:grab;padding:6px 30px 7px 10px;background:var(--mv);border-color:color-mix(in srgb,var(--mc) 25%,#fff);border-left:4px solid var(--sc);display:flex;flex-direction:column;gap:3px}
.nd.task:hover{border-color:color-mix(in srgb,var(--mc) 55%,#fff);border-left-color:var(--sc)}
.nd.task .l1{display:flex;gap:6px;align-items:baseline}
.nd.task .tm{font-variant-numeric:tabular-nums;color:#4B5563;font-size:12px;white-space:nowrap}
.nd.task .nm{font-weight:600}
.nd.task .l2{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.sic{width:16px;text-align:center;font-size:12px}
.pds{display:inline-flex;gap:2px;cursor:pointer;padding:2px 3px;border-radius:6px}
.pds:hover{background:rgba(0,0,0,.06)}
.pd{display:inline-block;width:10px;height:10px;border-radius:50%}
.pd.ok{background:#16A34A}.pd.idea{background:#F59E0B}.pd.none{background:#fff;border:1.5px solid #9CA3AF}
.s-chua{--sc:var(--chua)}.s-dang{--sc:var(--dang)}.s-xong{--sc:var(--xong)}.s-quagio{--sc:var(--quagio)}.s-tre{--sc:var(--tre)}.s-chuyen{--sc:var(--chuyen)}.s-bo{--sc:var(--bo)}
.nd.add{border-style:dashed;color:var(--mute);background:#fff;cursor:pointer;font-size:12px;padding:4px 10px;width:max-content}
.nd.add:hover{color:var(--brand);border-color:var(--brand)}
.dots{position:absolute;top:4px;right:4px;border:0;background:transparent;cursor:pointer;color:inherit;opacity:.7;font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.dots:hover{background:rgba(0,0,0,.08);opacity:1}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:#EDE9FE;color:#5B21B6;margin-top:5px}
.dragging{opacity:.35}
.drop-before{box-shadow:0 -4px 0 0 #2563EB}
.drop-after{box-shadow:0 4px 0 0 #2563EB}
.drop-in{outline:2px dashed #2563EB;outline-offset:3px}

/* ===== menu / popover ===== */
#menu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:4px;min-width:200px;max-width:420px;display:none}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer}
#menu button:hover{background:var(--soft)}
#menu button.danger{color:var(--quagio)}
#menu .pop{padding:8px 10px;font-size:13px}
#menu .pop div{padding:3px 0}
.lnkbtn{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:7px;background:#EFF6FF;border:1px solid #BFDBFE;color:#1D4ED8;font-weight:600;text-decoration:none;font-size:12px}
.lnkbtn:hover{background:#DBEAFE}
.nolk{color:#C2410C;font-weight:600}
.pl{padding-left:12px}
.misst td,.misst th{vertical-align:middle}
.mcell{border:1px solid #FECACA;background:#FEF2F2;color:#B91C1C;font-weight:700;border-radius:8px;padding:3px 10px;cursor:pointer;font-size:13px}
.mcell:hover{background:#FEE2E2}
.okc{color:var(--xong);font-weight:700}
.allok{padding:8px 12px;border-radius:10px;background:#DCFCE7;color:#166534;font-weight:700}
.nd.addnhom{font-weight:600}
.nd.cd{cursor:pointer}

/* ===== Việc của tôi ===== */
.mehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mehead .big{font-size:17px;font-weight:700}
.remind{background:#FEF3C7;border:1px solid #FCD34D;color:#92400E;padding:9px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.tlist{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.shd{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--mute);padding:10px 14px 6px;background:#FAFBFC;border-bottom:1px solid var(--soft)}
.trow{display:grid;grid-template-columns:122px 30px minmax(0,1fr) auto auto 28px;gap:8px;align-items:center;padding:9px 12px 9px 14px;border-bottom:1px solid var(--soft);position:relative}
.trow:last-child{border-bottom:0}
.trow .tt{font-variant-numeric:tabular-nums;font-size:13px;color:#374151;white-space:nowrap}
.trow .tt.late{color:var(--quagio);font-weight:700}
.trow .tn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.trow .nm{font-weight:600;font-size:14px}
.trow .tr{display:flex;gap:6px;align-items:center}
.trow .dots{position:static;color:var(--mute)}
.trow.done .nm{color:#6B7280}
.trow.done{background:#FAFCFB}
.trow.off{opacity:.6}
.trow.strike .nm{text-decoration:line-through}
.mtag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--mcd);border:1px solid color-mix(in srgb,var(--mc) 50%,#fff);color:#1F2937}
.dtag{font-size:12px;padding:1px 8px;border-radius:20px;border:1px solid #CBD5E1;background:#fff;cursor:pointer;white-space:nowrap}
.dtag:hover{border-color:var(--brand)}
.dtag.prog{font-weight:700}
.dtag.prog.ok{background:#DCFCE7;border-color:#86EFAC;color:#166534}
.cb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:2px solid #94A3B8;border-radius:6px;cursor:pointer;background:#fff;font-size:13px;font-weight:800;color:#fff}
.cb:hover{border-color:var(--xong)}
.cb.on{background:var(--xong);border-color:var(--xong)}
.cb.on::after{content:"✓"}
.cb.auto{cursor:default;border-style:dashed}
.cb.auto.on{border-style:solid}
.cb.off{cursor:default;border-color:#CBD5E1;color:#6B7280;background:#F3F4F6;font-size:11px}
.cb.q{cursor:default;border-color:#F59E0B;color:#B45309;background:#FFFBEB}
.lnk{text-decoration:none;font-size:15px}
.slsel{border:1px solid #F59E0B;border-radius:8px;padding:2px 6px;font-size:12px;background:#FFFBEB}
.tpanel{padding:8px 14px 12px 150px;background:#FAFBFC;border-bottom:1px solid var(--soft)}
.tpanel input,.tpanel select{border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:13px;background:#fff}
.tpanel .lkin{width:min(460px,100%)}
.ptab td,.ptab th{padding:4px 5px}
.ptab input.idea{width:100%;min-width:220px}
.ptab input.lk{width:100%;min-width:180px}
.ptab input[type=time]{width:92px}
.claim{border:1px solid #DDD6FE;background:#FAF8FF}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid #EDE9FE;font-size:13px}
.crow:first-of-type{border-top:0}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 7px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;background:#FAFBFC}
td.c,th.c{text-align:center}
.tbl{overflow-x:auto}

/* ===== Tiến độ ===== */
.now-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.now-card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:12px}
.now-card b{display:block;font-size:13px;margin-bottom:2px}
.gantt{overflow-x:auto}
.g-inner{min-width:820px;position:relative}
.g-row{display:grid;grid-template-columns:110px 1fr;align-items:center;border-top:1px solid var(--soft)}
.g-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.g-track{position:relative}
.g-bar{position:absolute;height:20px;border-radius:6px;background:var(--sc);color:#fff;font-size:11px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:6px}
.g-bar.s-chua{background:#CBD5E1;color:#334155}
.g-bar.full{background:repeating-linear-gradient(45deg,#E5E7EB,#E5E7EB 6px,#F3F4F6 6px,#F3F4F6 12px);color:#4B5563;height:16px}
.g-axis{display:grid;grid-template-columns:110px 1fr}
.g-hours{position:relative;height:20px;font-size:11px;color:var(--mute)}
.g-hours span{position:absolute;transform:translateX(-50%)}
.g-grid{position:absolute;top:20px;bottom:0;left:110px;right:0;pointer-events:none}
.g-grid i{position:absolute;top:0;bottom:0;border-left:1px dashed #E5E7EB}
.g-now{position:absolute;top:0;bottom:0;border-left:2px solid var(--quagio)}
.mcards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1000px){.mcards{grid-template-columns:repeat(2,1fr)}}
.mcard{border:1px solid var(--line);border-top:4px solid var(--mc);border-radius:12px;padding:10px;background:var(--mv)}
.mcard b{font-size:14px}
.mcard .r{display:flex;justify-content:space-between;font-size:12px;margin-top:4px}
.handover{width:100%;table-layout:fixed}
.handover th{border-top:4px solid var(--mc);background:var(--mcd);color:var(--ink);font-size:13px}
.handover td{vertical-align:top;font-size:12px}
.handover textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:13px;resize:vertical}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:190px;padding-top:10px}
.bday{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px}
.bpair{display:flex;gap:3px;align-items:flex-end;height:140px}
.bpair i{display:block;width:16px;border-radius:4px 4px 0 0}

/* ===== Cài đặt ===== */
.brow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;margin-bottom:10px}
.brow .bm{font-weight:800;color:var(--mc);padding-top:8px}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.blk{border:1px solid color-mix(in srgb,var(--mc) 35%,#fff);border-left:4px solid var(--mc);border-radius:10px;padding:8px 10px;background:var(--mv)}
.blk ul{margin:4px 0 6px;padding-left:16px;font-size:12px;color:#374151}
.liblist{max-height:206px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.lrow{display:grid;grid-template-columns:1.4fr 1.4fr auto 34px;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--soft);font-size:13px;height:41px}
.lrow:last-child{border-bottom:0}
.lrow .ln{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== modal ===== */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:60;overflow:auto}
.modal.hidden{display:none}
.sheet{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet.wide{max-width:1000px}
.sheet h2{margin:0 0 12px;font-size:17px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12px;font-weight:600;color:var(--mute)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;width:100%}
.f textarea{min-height:56px;resize:vertical}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer}
.pick.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.f .chk input,.chk input{width:auto;padding:0;margin:0;flex:none}
.f label.chk{color:var(--ink);font-weight:500}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.warnbox{background:#FEF3C7;border:1px solid #FCD34D;color:#78350F;border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:13px}
.warnbox .bar{margin:8px 0 0}
.msel{position:relative}
.msel-btn{display:flex;gap:4px;flex-wrap:wrap;align-items:center;width:100%;min-height:38px;text-align:left;border:1px solid var(--line);border-radius:9px;padding:6px 28px 6px 8px;background:#fff;cursor:pointer;position:relative}
.msel-btn::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mute)}
.msel-pop{position:fixed;z-index:95;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px;max-height:280px;overflow:auto;display:none;min-width:200px}
.msel.open .msel-pop{display:block}
.mopt{padding:5px 6px;border-radius:7px}
.mopt:hover{background:var(--soft)}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:95;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:260px;overflow:auto;display:none}
.combo.open .combo-list{display:block}
.ci{padding:7px 10px;cursor:pointer;font-size:13px}
.ci:hover{background:var(--soft)}
.ci.new{color:var(--brand);border-top:1px solid var(--soft)}
.cg{font-size:11px;color:var(--mute);padding:7px 10px 2px;font-weight:800}
.hrow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:80;max-width:92vw;display:flex;gap:12px;align-items:center;pointer-events:none}
#toast.on{opacity:1;pointer-events:auto}
#toast.err{background:#991B1B}
#toast button{background:#fff;color:#111827;border:0;border-radius:6px;padding:3px 9px;font-weight:700;cursor:pointer}
.empty{padding:24px;text-align:center;color:var(--mute);border:1px dashed #CBD2DC;border-radius:12px;background:#fff}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:12px}
ol.guide li{margin-bottom:6px}
tr.boed td{opacity:.45;text-decoration:line-through}

// Chạy trên web (Apps Script): gọi thẳng máy chủ qua google.script.run, không cần dán URL
const GAS = !!(window.google && google.script && google.script.run);

function gasCall(req){
  return new Promise((ok, no) => google.script.run
    .withSuccessHandler(r => { let j; try { j = typeof r === 'string' ? JSON.parse(r) : r; } catch (e) { return no(new Error('Dữ liệu trả về lỗi')); } j && j.ok ? ok(j.data) : no(new Error((j && j.error) || 'Lỗi máy chủ')); })
    .withFailureHandler(e => no(new Error((e && e.message) || String(e))))

}
async function apiGet(params){

  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Lỗi máy chủ'); return j.data;
}

  try {
    const r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'batch', ops }) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error); return j.data;
  } catch (e) {
    // Dự phòng: chia nhỏ gửi bằng GET
    let chunk = [];
    const flush = async () => { if (chunk.length) { await apiGet({ action: 'batch', ops: JSON.stringify(chunk) }); chunk = []; } };
    for (const op of ops) { chunk.push(op); if (encodeURIComponent(JSON.stringify(chunk)).length > 1800 && chunk.length > 1) { const last = chunk.pop(); await flush(); chunk.push(last); } }
    await flush();
  }
}

    S.viec.filter(v => v.ngay === ngay && v.ca === ca && v.mang === m && v.trangThai === 'Chưa làm' && !v.gap).forEach(v => {
      if (P.length === 1) {

      } else if (v.nguoi && !P.includes(v.nguoi)) ops.push(sv('viec', Object.assign({}, v, { nguoi: '' })));
    });
  });
  return ops;
}

let DRAG = null;
function clearDrop(){ document.querySelectorAll('.drop-before,.drop-after,.drop-in').forEach(x => x.classList.remove('drop-before','drop-after','drop-in')); }
function dropTarget(e){
  if (!DRAG) return null;
  const el = e.target.closest('[data-dg],[data-dz]'); if (!el) return null;
  const m = el.dataset.m || el.dataset.mm; if (m !== DRAG.m) return null;
  const r = el.getBoundingClientRect(), before = e.clientY < r.top + r.height / 2;
  if (DRAG.kind === 'cd') {
    if (el.dataset.dg === 'cd' && el.dataset.id !== DRAG.id) return { el, type: 'cd', id: el.dataset.id, pos: before ? 'before' : 'after' };
    if (el.dataset.dz === 'nhom') return { el, type: 'nhom', nhom: el.dataset.nhom, pos: 'in' };

  } else {
    if (el.dataset.dg === 'task' && el.dataset.key !== DRAG.key) return { el, type: 'task', key: el.dataset.key, pos: before ? 'before' : 'after' };
    if (el.dataset.dg === 'cd') return { el, type: 'cd', id: el.dataset.id, pos: 'in' };
    if (el.dataset.dz === 'cdend') return { el, type: 'cd', id: el.dataset.cd2, pos: 'in' };
  }
  return null;
}
let DRAG2 = null;
const slotTasksFor = (p, ca) => slotTasks().filter(v => v.nguoi === p && v.ca === ca && isLive(v) && (v.caCa === '1' || !v.batDau));
document.addEventListener('dragstart', e => {

document.addEventListener('dragover', e => {
  if (DRAG2) { const t2 = myDropTarget(e); clearDrop(); if (!t2) return; e.preventDefault(); t2.el.classList.add(t2.pos === 'before' ? 'drop-before' : t2.pos === 'after' ? 'drop-after' : 'drop-in'); return; }
  const t = dropTarget(e); clearDrop(); if (!t) return;

});
document.addEventListener('drop', e => {
  if (DRAG2) { const t2 = myDropTarget(e); clearDrop(); if (!t2) return; e.preventDefault(); const id = DRAG2; DRAG2 = null; myDrop(id, t2); return; }
  const t = dropTarget(e); clearDrop(); if (!t) return; e.preventDefault();
  if (DRAG.kind === 'cd') moveCd(DRAG.id, t); else moveTask(DRAG.key, t);
});
document.addEventListener('dragend', () => { clearDrop(); document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); DRAG = null; DRAG2 = null; });
function moveCd(id, t){
  const c = cdById(id); if (!c) return;
  const tgtCd = t.type === 'cd' ? cdById(t.id) : null;
  const nhom = NHOM_MANG[c.mang] ? (tgtCd ? cdNhom(tgtCd) : t.nhom) : '';
  const list = cdsOf(S.date, S.ca).filter(x => x.mang === c.mang && cdNhom(x) === nhom && x.id !== id);
  let idx = list.length;
  if (tgtCd) { idx = list.findIndex(x => x.id === tgtCd.id); if (t.pos === 'after') idx++; }
  list.splice(idx, 0, c);
  const ops = [];
  list.forEach((x, i) => { const nx = Object.assign({}, x, { thuTu: String(i + 1) }); if (x.id === id) nx.nhom = nhom; if (nx.thuTu !== x.thuTu || nx.nhom !== x.nhom) ops.push(sv('chude', nx)); });
  if (c.nhom !== nhom) S.viec.filter(v => v.chuDeId === id).forEach(v => ops.push(sv('viec', Object.assign({}, v, { nhom }))));
  commit(ops, c.nhom !== nhom ? `Đã chuyển chủ đề sang nhóm ${nhom}` : '');
}
function moveTask(key, t){
  const g = S.viec.filter(v => gkey(v) === key); if (!g.length) return;
  const tCd = t.type === 'cd' ? cdById(t.id) : cdById((S.viec.find(v => gkey(v) === t.key) || {}).chuDeId);
  if (!tCd) return;
  const groups = groupsOfCd(tCd.id).filter(x => gkey(x[0]) !== key);
  let idx = groups.length;
  if (t.type === 'task') { idx = groups.findIndex(x => gkey(x[0]) === t.key); if (t.pos === 'after') idx++; }
  groups.splice(idx, 0, g);
  const ops = [], moved = g[0].chuDeId !== tCd.id;
  groups.forEach((gr, i) => gr.forEach(v => {
    const nv = Object.assign({}, v, { thuTu: String(i + 1) });
    if (gkey(v) === key) Object.assign(nv, { chuDeId: tCd.id, chuDeTen: tCd.chuDe, nhom: tCd.nhom });
    if (nv.thuTu !== v.thuTu || nv.chuDeId !== v.chuDeId) ops.push(sv('viec', nv));
  }));
  if (moved) g.forEach(v => postsOf(v.id).forEach(b => ops.push(sv('bai', Object.assign({}, b, { chuDeTen: tCd.chuDe })))));
  commit(ops, moved ? `Đã chuyển việc sang "${tCd.chuDe}"` : '');
}

  const me = cfg.me;

  const live = mine.filter(v => v.trangThai !== 'Bỏ');

  return h;

function claimSection(me){
  const myM = myMangs(me);

// Hạn của 1 việc: việc theo giờ = giờ kết thúc; việc cả ca = 30 phút trước khi hết ca
const dueMin = v => (v.caCa === '1' || !v.batDau) ? (CA[v.ca] || CA['Sáng']).e - 30 : span(v)[1];
const slotDue = (ngay, ca) => { const t = workday(); return ngay < t || (ngay === t && nowRel() >= (CA[ca] || CA['Sáng']).e - 30); };
const isDue = v => { const t = workday(); return v.ngay < t || (v.ngay === t && nowRel() >= dueMin(v)); };
const noMetric = b => b.link && !String(b.tiepCan || '').trim() && !String(b.thich || '').trim() && !String(b.binhLuan || '').trim();
function missData(live, bs){
  const tick = live.filter(v => v.nguoi && v.trangThai === 'Chưa làm' && !v.gap && isDue(v) && !postsOf(v.id).some(isDoneP));
  const so = bs.filter(b => noMetric(b) && slotDue(b.ngay, b.ca)).map(b => Object.assign({ _p: bInfo(b).nguoi || b.nguoi }, b)).filter(b => b._p);
  const dueAny = live.some(isDue) || bs.some(b => b.link && slotDue(b.ngay, b.ca));
  const people = [...new Set(live.map(v => v.nguoi).filter(Boolean))];
  const rows = people.map(p => ({ p, t: tick.filter(v => v.nguoi === p), s: so.filter(b => b._p === p) }))
    .sort((a, b) => (b.t.length + b.s.length) - (a.t.length + a.s.length) || names().indexOf(a.p) - names().indexOf(b.p));
  return { rows, dueAny, total: tick.length + so.length };
}
function missSection(live, bs){

  let body;
  if (!d.dueAny) body = '<div class="hint">Chưa có việc nào tới hạn cập nhật.</div>';
  else if (!d.total) body = '<div class="allok">✅ Cả team đã cập nhật đủ</div>';

  return `<div class="card sec"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">📋 Ai còn thiếu cập nhật</h3>${d.total ? '<button class="btn sm" data-act="misscopy" style="margin-left:auto">📋 Copy nhắc nhở</button>' : ''}</div>

function fallbackCopy(t, done){ const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch(e) { toast('Không copy được, hãy copy tay', true); } a.remove(); }
function nowGrid(live){

function gantt(live){
  const START = S.td === 'ngay' ? 480 : CA[S.ca].s - 30, END = S.td === 'ngay' ? 1500 : CA[S.ca].e + 30, SPAN = END - START;
  const x = m => Math.max(0, Math.min(100, (m - START) / SPAN * 100));
  let hours = '', grid = '';
  for (let m = Math.ceil(START / 60) * 60; m <= END; m += 60) { hours += `<span style="left:${x(m)}%">${p2((m / 60) % 24)}h</span>`; grid += `<i style="left:${x(m)}%"></i>`; }
  const people = [...new Set(live.map(v => v.nguoi).filter(Boolean))];
  if (!people.length) return '<div class="hint">Chưa có việc.</div>';
  const nowM = nowRel();
  let h = `<div class="gantt"><div class="g-inner"><div class="g-axis"><div></div><div class="g-hours">${hours}</div></div><div class="g-grid">${grid}${S.date === workday() && nowM >= START && nowM <= END ? `<div class="g-now" style="left:${x(nowM)}%"></div>` : ''}</div>`;

    const ts = live.filter(v => v.nguoi === p);
    const timed = ts.filter(v => v.caCa !== '1' && v.batDau).sort((a, b) => span(a)[0] - span(b)[0]);
    const full = ts.filter(v => v.caCa === '1' || !v.batDau);
    let bars = '', top = 4;
    const cg = {}; full.forEach(v => (cg[v.ca] = cg[v.ca] || []).push(v));
    Object.keys(cg).forEach(ca => { const g = cg[ca]; const w = CA[ca]; const d = g.filter(v => v.trangThai === 'Xong').length;

    if (Object.keys(cg).length) top += 20;
    const lanes = [];
    timed.forEach(v => { const [s, e0] = span(v); const e = Math.max(e0, s + 10);
      let ln = lanes.findIndex(end => end <= s); if (ln < 0) { ln = lanes.length; lanes.push(e); } else lanes[ln] = e;
      const k = stOf(v);
      bars += `<div class="g-bar s-${k}" style="left:${x(s)}%;width:${Math.max(.7, x(e) - x(s))}%;top:${top + ln * 24}px" data-act="gpop" data-id="${v.id}">${v.gap ? '⚡' : ''}${esc(v.viec)}</div>`; });
    const hgt = top + Math.max(lanes.length, Object.keys(cg).length ? 0 : 1) * 24 + 4;
    h += `<div class="g-row"><div class="g-name">${pc(p)}</div><div class="g-track" style="height:${hgt}px">${bars}</div></div>`;
  });
  return h + `</div></div><div class="hint" style="margin-top:6px">Bấm vào ô việc để xem nhanh nội dung. Thanh sọc = việc cả ca, bấm để xem danh sách.</div>`;
}

function delPending(id){
  const v = vById(id); if (!v) return;
  const ps = postsOf(id), keep = ps.filter(isDoneP), drop = ps.filter(b => !isDoneP(b));
  const before = [{ type: 'viec', obj: v }, ...ps.map(b => ({ type: 'bai', obj: b }))];
  const ops = keep.length
    ? [sv('viec', Object.assign({}, v, { trangThai: 'Bỏ', soLuong: String(keep.length), lyDo: (v.lyDo || '') + ' · đã xoá khỏi tồn đọng' })), ...drop.map(b => dl('bai', b.id))]
    : [dl('viec', id), ...ps.map(b => dl('bai', b.id))];
  commit(ops);
  toast(keep.length ? `Đã xoá phần chưa làm, giữ ${keep.length} bài đã xong` : 'Đã xoá việc khỏi tồn đọng', false, 'Hoàn tác', () => commit(before.map(x => sv(x.type, x.obj)), 'Đã khôi phục'));
}
function postLines(v){

}

    }
  }
  const sh = { chuDeId: cd.id, chuDeTen: cd.chuDe, mang: cd.mang, nhom: cd.nhom, viec: name, caCa, batDau: bd, ketThuc: kt, kenh: readPicks('vkenh'), dangBai: readPicks('vdang'), ghiChu: $('v_gc').value.trim() };
  let ops = [];
  if (!st.key) {
    const key = uid('g'); const order = groupsOfCd(cd.id).length + 1;
    (people.length ? people : ['']).forEach(p => ops.push(sv('viec', newTask(Object.assign({}, sh, { ngay: S.date, ca: S.ca, cd, nguoi: p, nhomViec: key, soLuong: slv || '1', thuTu: order })))));
  } else {
    const grp = S.viec.filter(v => gkey(v) === st.key && v.trangThai !== 'Đã chuyển');
    const left = people.slice(); const kept = [];
    const blocked = [];
    grp.forEach(v => {
      let who = null;
      if (v.nguoi && left.includes(v.nguoi)) who = v.nguoi;
      else if (!v.nguoi && left.length) who = left[0];
      if (who != null) { left.splice(left.indexOf(who), 1); kept.push(Object.assign({}, v, sh, { nguoi: who })); return; }
      if (!people.length && !kept.length) { kept.push(Object.assign({}, v, sh, { nguoi: '' })); return; }
      if (postsOf(v.id).length || v.trangThai !== 'Chưa làm') { blocked.push(v.nguoi); kept.push(Object.assign({}, v, sh)); return; }
      ops.push(dl('viec', v.id));
    });
    left.forEach(p => kept.push(newTask(Object.assign({}, sh, { ngay: S.date, ca: S.ca, cd, nguoi: p, nhomViec: st.key, soLuong: grp[0] ? grp[0].soLuong : '', goiY: grp[0] ? grp[0].goiY : '', thuTu: grp[0] ? grp[0].thuTu : '' }))));
    if (slEl && slv !== '') {
      const drops = [];
      for (const v of kept) {
        const ps = postsOf(v.id), links = ps.filter(b => b.link).length;
        if (num(slv) < links) return toast(`${v.nguoi || 'Việc'} đã đăng ${links} bài, không giảm dưới ${links} được`, true);
        ps.filter(b => num(b.stt) > num(slv)).forEach(b => drops.push({ v, b }));
      }
      if (drops.length && !st.slOk) {
        $('v_warn').innerHTML = `<div class="warnbox">⚠️ Giảm còn ${slv} bài sẽ xoá idea đã lên ở: ${drops.map(x => `${esc(x.v.nguoi || '')} bài ${esc(x.b.stt)}`).join(', ')}.<div class="bar"><button class="btn sm" data-act="close">Huỷ</button><button class="btn sm pri" data-act="slok">Đồng ý giảm</button></div></div>`;
        return;
      }
      drops.forEach(x => ops.push(dl('bai', x.b.id)));
      kept.forEach(v => { v.soLuong = slv; });
    }
    kept.forEach(v => { v.trangThai = autoStatus(v, postsOf(v.id).filter(b => !slv || num(b.stt) <= num(slv))); ops.push(sv('viec', v)); });
    if (blocked.length) toast(`Giữ lại phần của ${blocked.filter(Boolean).join(', ')} vì đã có bài / đã làm`);
  }
  if (st.kind === 'new' && $('v_save') && $('v_save').checked && !libViec(cd.mang, cd.chuDe).some(x => x.ten === name)) ops.push(sv('thuvien', { id: uid('tv'), loai: 'viec', mang: cd.mang, nhom: cd.nhom, chuDeTen: cd.chuDe, ten: name, kenh: sh.kenh, dangBai: sh.dangBai, caCa, batDau: bd, ketThuc: kt, soLuong: slv || '' }));
  closeModal(); commit(ops, 'Đã lưu việc');
}

function saveMy(){

  closeModal(); commit([sv('viec', Object.assign({}, v, { caCa, batDau: bd, ketThuc: kt }))], `Đã đổi giờ: ${v.viec} → ${caCa ? 'cả ca' : bd + (kt ? '–' + kt : '')}`);
}
function myDropTarget(e){
  const el = e.target.closest && e.target.closest('[data-dgm],[data-dzm]'); if (!el) return null;
  if (el.dataset.dzm) return { el, zone: el.dataset.dzm, pos: 'in' };
  if (el.dataset.dgm === DRAG2) return null;
  const r = el.getBoundingClientRect();
  return { el, id: el.dataset.dgm, pos: e.clientY < r.top + r.height / 2 ? 'before' : 'after' };
}
function myDrop(id, t){
  const v = vById(id); if (!v) return;
  const [s0, e0] = span(v), full0 = (v.caCa === '1' || !v.batDau) && !v.gap, dur = full0 ? 30 : Math.max(5, e0 - s0);
  let pre;
  if (t.zone === 'full') pre = { caCa: '1' };
  else if (t.zone === 'timed') { const s = CA[S.ca].s; pre = { caCa: '', bd: hhmm(s), kt: hhmm(s + dur) }; }
  else {
    const r = vById(t.id); if (!r) return;
    if ((r.caCa === '1' || !r.batDau) && !r.gap) pre = { caCa: '1' };
    else { const [rs, re] = span(r); let s = t.pos === 'after' ? re : rs - dur; s = Math.round(s / 5) * 5; pre = { caCa: '', bd: hhmm(s), kt: hhmm(s + dur) }; }
  }
  myModal(id, pre);
}

/* ---------- Lưu khối mẫu (theo nhóm / mảng) ---------- */
function saveBlockFor(m, nhom){
  const cds = cdsOf(S.date, S.ca).filter(c => c.mang === m && (!NHOM_MANG[m] || cdNhom(c) === nhom) && c.chuDe !== '⚡ Việc gấp');
  if (!cds.length) return toast('Chưa có chủ đề để lưu', true);
  const name = NHOM_MANG[m] ? nhom : ((blockList().find(b => b.mang === m) || {}).khoi || `${m} hằng ngày`);
  const exists = S.mau.some(x => x.mang === m && x.khoi === name);
  const go = () => {
    const old = S.mau.filter(x => x.mang === m && x.khoi === name);
    const ops = old.map(x => dl('mau', x.id));
    const base = S.mau.reduce((mx, x) => Math.max(mx, num(x.thuTu)), 0) + 1;
    // Việc có giờ thuộc ca khác (vd khung 18H khi lưu từ ca sáng) không có trên cây ca này → giữ lại từ khối cũ
    const otherCa = t => !t.caCa && mins(t.batDau) != null && !inCa(S.ca, t.batDau);
    cds.forEach((c, i) => {
      const vs = groupsOfCd(c.id).filter(g => !g[0].gap && g.some(v => v.trangThai !== 'Bỏ')).map(g => { const v = g[0]; return { viec: v.viec, caCa: v.caCa, batDau: v.batDau, ketThuc: v.ketThuc, kenh: v.kenh, dangBai: v.dangBai, soLuong: v.soLuong !== '' ? v.soLuong : (v.goiY || '') }; });
      old.filter(o => o.chuDe === c.chuDe).forEach(o => jparse(o.viecJson).filter(otherCa).forEach(t => { if (!vs.some(x => x.viec === t.viec)) vs.push(t); }));
      ops.push(sv('mau', { id: uid('mau'), khoi: name, mang: m, nhom: NHOM_MANG[m] ? nhom : '', thuTu: String(base + i), chuDe: c.chuDe, kenhCan: c.kenhCan, ghiChu: c.ghiChu, viecJson: JSON.stringify(vs) }));
    });
    // Chủ đề trong khối chỉ có việc của ca khác (không dán vào ca này) → giữ nguyên
    old.filter(o => !cds.some(c => c.chuDe === o.chuDe) && jparse(o.viecJson).length && jparse(o.viecJson).every(otherCa)).forEach((o, j) => ops.push(sv('mau', Object.assign({}, o, { id: uid('mau'), thuTu: String(base + cds.length + j) }))));
    commit(ops, `Đã lưu khối "${name}"`);
  };
  if (exists) confirmModal('💾 Ghi đè khối mẫu?', `Đã có khối <b>${esc(name)}</b> (${esc(m)}). Ghi đè bằng ${cds.length} chủ đề hiện tại trên cây? Việc có giờ của ca khác trong khối (vd khung 18H) vẫn được giữ.`, 'Ghi đè', go);
  else go();
}

const inCa = (ca, t) => { const st = mins(t); return st != null && st >= CA[ca].s && st < CA[ca].e; };
function eveTasksFor(c){
  const out = [];
  groupsOfCd(c.id).forEach(g => { const v = g[0]; if (v.gap) return;
    const full = v.caCa === '1' || !v.batDau;
    if (full || inCa('Tối', v.batDau)) out.push({ viec: v.viec, caCa: full ? '1' : '', batDau: full ? '' : v.batDau, ketThuc: full ? '' : v.ketThuc, kenh: v.kenh, dangBai: v.dangBai, soLuong: v.soLuong, ghiChu: v.ghiChu, thuTu: v.thuTu }); });
  S.mau.filter(m => m.mang === c.mang && m.chuDe === c.chuDe).forEach(m => jparse(m.viecJson).forEach((t, i) => {
    if (t.caCa || !inCa('Tối', t.batDau) || out.some(x => x.viec === t.viec)) return;
    out.push({ viec: t.viec, caCa: '', batDau: t.batDau, ketThuc: t.ketThuc, kenh: t.kenh, dangBai: t.dangBai, soLuong: String(t.soLuong) === '0' ? '0' : String(num(t.soLuong) || 1), ghiChu: '', thuTu: String(100 + i) }); }));

}

let tT, tCb;
function toast(msg, err, btn, cb){
  const t = $('toast'); t.innerHTML = esc(msg) + (btn ? ` <button id="toastBtn">${esc(btn)}</button>` : '');
  t.className = 'on' + (err ? ' err' : ''); tCb = cb || null;
  if (btn) $('toastBtn').onclick = () => { t.className = ''; if (tCb) tCb(); tCb = null; };
  clearTimeout(tT); tT = setTimeout(() => { t.className = ''; tCb = null; }, btn ? 6000 : 2600);
}

    case 'menu-my': { const v = vById(el.dataset.id); openMenu(el, [['m-myedit','🕘 Đổi giờ',`data-id="${v.id}"`],['m-delmine','🗑 Xoá việc của tôi',`data-id="${v.id}"`,'danger']]); break; }
    case 'menu-cd': openMenu(el, [['m-editcd','✎ Sửa chủ đề',`data-id="${el.dataset.id}"`],['newv','+ Việc nhỏ',`data-cd="${el.dataset.id}"`],['m-dupcd','⧉ Nhân bản kèm việc nhỏ',`data-id="${el.dataset.id}"`],['m-delcd','🗑 Xoá chủ đề',`data-id="${el.dataset.id}"`,'danger']]); break;
    case 'menu-mang': { const m = el.dataset.m; const items = [['newcd','+ Chủ đề',`data-m="${esc(m)}" data-nhom="${esc(defNhom(m))}"`]]; if (NHOM_MANG[m]) items.push(['newnhom','+ Nhóm mới',`data-m="${esc(m)}"`]); if (!NHOM_MANG[m]) items.push(['m-saveblock','💾 Lưu mảng này thành khối mẫu',`data-m="${esc(m)}" data-nhom=""`]); openMenu(el, items); break; }
    case 'menu-nhom': openMenu(el, [['newcd','+ Chủ đề vào nhóm này',`data-m="${esc(el.dataset.m)}" data-nhom="${esc(el.dataset.nhom)}"`],['m-saveblock','💾 Lưu nhóm này thành khối mẫu',`data-m="${esc(el.dataset.m)}" data-nhom="${esc(el.dataset.nhom)}"`]]); break;
    case 'm-editv': vModal(el.dataset.key); break;
    case 'm-dupv': dupGroup(el.dataset.key); break;
    case 'm-delv': delGroup(el.dataset.key); break;
    case 'm-myedit': myModal(el.dataset.id); break;
    case 'm-delay': { const v = vById(el.dataset.id); if (v) delayModal(v); break; }
    case 'm-delmine': delMine(el.dataset.id); break;
    case 'm-editcd': cdModal(el.dataset.id); break;
    case 'editcd': cdModal(el.dataset.id); break;
    case 'm-dupcd': dupCd(el.dataset.id); break;
    case 'm-delcd': delCd(el.dataset.id); break;
    case 'm-saveblock': saveBlockFor(el.dataset.m, el.dataset.nhom); break;
    case 'saveurl': cfg.url = $('urlInp').value.trim(); ls.set(CFG_KEY, cfg); S.loaded = ''; S.nhanSu = []; load().then(() => { if (!S.err && cfg.url) toast('Đã kết nối Google Sheet'); }); break;
    case 'clearurl': cfg.url = ''; ls.set(CFG_KEY, cfg); S.loaded = ''; load(); break;
    case 'ping': { const u = $('urlInp').value.trim(); if (!u) { toast('Chưa nhập URL'); break; } apiPing(u).then(() => toast('Kết nối tốt ✓')).catch(err => toast('Không kết nối được: ' + err.message, true)); break; }
    case 'resetdemo': Demo.reset(); S.loaded = ''; load(); toast('Đã làm mới dữ liệu mẫu'); break;
    case 'pushseed': { const db = seedDb(); commit([...db.mau.map(x => sv('mau', x)), ...db.macDinh.map(x => sv('macdinh', x))], 'Đã đưa khối mẫu và phân công lên Sheet'); break; }
    case 'delblock': { const k = el.dataset.k; const items = S.mau.filter(x => bkey(x) === k).map(x => ({ type: 'mau', obj: x })); confirmModal('🗑 Xoá khối mẫu?', `Xoá khối <b>${esc(k.split('|')[1])}</b> (${items.length} chủ đề)?`, 'Xoá', () => delWithUndo(items, 'khối')); break; }
    case 'renblock': { const k = el.dataset.k, [m, kh] = k.split('|'); window._rb = k;
      openModal(`<h2>Đổi tên khối mẫu</h2><div class="f"><label>Tên mới</label><input id="rb_name" value="${esc(kh)}"></div>${NHOM_MANG[m] ? '<div class="hint">Tên khối cũng là tên nhóm trên cây khi dán mẫu.</div>' : ''}<div class="mfoot"><button class="btn" data-act="close">Huỷ</button><button class="btn pri" data-act="dorenblock">Lưu</button></div>`); break; }
    case 'dorenblock': { const [m] = window._rb.split('|'); const nm = $('rb_name').value.trim(); if (!nm) break; const ops = S.mau.filter(x => bkey(x) === window._rb).map(x => sv('mau', Object.assign({}, x, { khoi: nm, nhom: NHOM_MANG[m] ? nm : x.nhom }))); closeModal(); commit(ops, 'Đã đổi tên khối'); break; }
    case 'libdel': libDel(el.dataset.ref); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'meSel') { cfg.me = t.value; ls.set(CFG_KEY, cfg); render(); return; }
  if (t.id === 'dateInp' && t.value) { S.date = t.value; load(); return; }
  if (t.closest && t.closest('.msel-pop')) {
    const ms = t.closest('.msel'); const all = [...ms.querySelectorAll('input[type=checkbox]')];
    const list = all.filter(x => x.checked).map(x => x.value);
    ms.dataset.val = list.join(', '); ms.dataset.dirty = '1';
    ms.querySelector('.msel-btn').innerHTML = mselLabel(list, ms.dataset.ph); return;
  }
  if (t.dataset.vid && t.dataset.f) { savePostField(t); return; }
  if (t.dataset.hk) { hoSet(t.dataset.hk, t.checked); hoRefresh(); return; }
  if (t.dataset.hc) { hoRefresh(); return; }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset && t.dataset.f === 'bangiao') {
    const m = t.dataset.id; const old = S.banGiao.find(x => x.ngay === S.date && x.ca === S.ca && x.mang === m);
    if ((old ? old.ghiChu : '') === t.value) return;
    commit([sv('bangiao', { id: S.date + '|' + S.ca + '|' + m, ngay: S.date, ca: S.ca, mang: m, ghiChu: t.value })], 'Đã lưu bàn giao ' + m);
  }
});
document.addEventListener('scroll', ev => { if (ev.target && ev.target.closest && (ev.target.closest('#menu') || ev.target.closest('.msel-pop') || ev.target.closest('.combo-list'))) return; closeMenu(); closeMsels(); }, true);

/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
Demo.init();
load();
setInterval(() => {
  if (!$('modal').classList.contains('hidden') || DRAG || DRAG2 || document.querySelector('.msel.open')) return;
  const a = document.activeElement; if (a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName)) return;
  if (online()) load(true); else render();
}, 60000);
</script>
</body>
</html>
